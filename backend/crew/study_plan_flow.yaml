schema: crewai.flow/v1
name: StudyPlanFlow
description: Analyze a student's performance and generate a personalized study plan.
state:
  type: json_schema
  json_schema:
    type: object
    properties:
      action:
        type: string
        enum:
          - generate_study_plan
      student_id:
        type: string
      course:
        type: string
    required:
      - action
      - student_id
      - course
methods:
  process_study_plan:
    start: true
    do:
      call: agent
      with:
        role: Study Plan Agent
        goal: Identify weak topics, build a realistic schedule to fix them, sync it to the calendar, and notify the student. Return the study plan summary.
        backstory: Autonomous handler of student performance analysis and study plan generation.
        tools:
          - custom:get_student_performance
          - custom:identify_weak_topics
          - custom:get_upcoming_deadlines
          - custom:generate_study_schedule
          - custom:save_study_plan
          - custom:update_calendar
          - custom:send_mail_to_student
        input: "Action: ${state.action}; Student ID: ${state.student_id}; Course: ${state.course}"
