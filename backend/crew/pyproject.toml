[project]
name = "staff_operations_manager"
version = "0.1.0"
description = "staff_operations_manager using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.11,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.crewai]
type = "flow"
definition = "flow.json"
project_id = "63dc479a-6c8e-418f-a22d-65345abed110"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
